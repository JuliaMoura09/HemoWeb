<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Artigo - HemoConecta</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pagina.css">
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <img src="logo2.png" alt="Logo HemoConecta" style="width: 20dvh; height: 5dvh;">
        </div>

        <div class="menu-label">Menu Principal</div>

        <nav class="nav flex-column">
            <a href="doadores.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Doadores</span>
            </a>

            <a href="descontos.html" class="nav-link">
                <i class="bi bi-gift"></i>
                <span>Empresas Parceiras</span>
            </a>

            <a href="medalhas.html" class="nav-link">
                <i class="bi bi-trophy"></i>
                <span>Medalhas e Rankings</span>
            </a>

            <a href="artigo.html" class="nav-link active">
                <i class="bi bi-book"></i>
                <span>Conteúdo Educacional</span>
            </a>
        </nav>
    </aside>

    <header class="topbar">
        <div class="text-end">
            <div class="user-name" id="user"></div>
            <div class="user-role">Administrador</div>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Editar Artigo</h1>

        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">

                    <div class="card artigo-card">
                        <div class="card-body p-3 p-md-4">

                            <form id="formArtigo">

                                <div class="mb-3">
                                    <label for="titulo" class="form-label">
                                        Título do Artigo
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="titulo"
                                        name="titulo"
                                        required
                                    >
                                </div>

                                <div class="mb-3">
                                    <label for="autor" class="form-label">
                                        Autor do Artigo
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="autor"
                                        name="autor"
                                        required
                                    >
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Tema do Artigo
                                    </label>

                                    <div class="temas-artigo" id="temasArtigo">
                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tema"
                                            id="temaDoacao"
                                            value="Processo de Doação"
                                            required
                                        >
                                        <label class="btn tema-btn" for="temaDoacao">
                                            Processo de Doação
                                        </label>

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tema"
                                            id="temaSangue"
                                            value="Tipos Sanguíneos"
                                        >
                                        <label class="btn tema-btn" for="temaSangue">
                                            Tipos Sanguíneos
                                        </label>

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tema"
                                            id="temaMedula"
                                            value="Medula Óssea"
                                        >
                                        <label class="btn tema-btn" for="temaMedula">
                                            Medula Óssea
                                        </label>

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tema"
                                            id="temaMitos"
                                            value="Mitos e Verdades"
                                        >
                                        <label class="btn tema-btn" for="temaMitos">
                                            Mitos e Verdades
                                        </label>

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tema"
                                            id="temaPosDoacao"
                                            value="Pós-doação"
                                        >
                                        <label class="btn tema-btn" for="temaPosDoacao">
                                            Pós-doação
                                        </label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="introducao" class="form-label">
                                        Sobre o artigo — Introdução
                                    </label>

                                    <textarea
                                        class="form-control mensagem-artigo"
                                        id="introducao"
                                        name="introducao"
                                        placeholder="Apresente o assunto e os principais pontos do artigo."
                                        required
                                    ></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="mensagem" class="form-label">
                                        Entenda o Assunto
                                    </label>

                                    <textarea
                                        class="form-control mensagem-artigo"
                                        id="mensagem"
                                        name="mensagem"
                                        placeholder="Desenvolva aqui o conteúdo do artigo."
                                        required
                                    ></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="curiosidade" class="form-label">
                                        Você sabia?
                                    </label>

                                    <textarea
                                        class="form-control mensagem-artigo"
                                        id="curiosidade"
                                        name="curiosidade"
                                        placeholder="Adicione uma curiosidade relacionada ao tema."
                                        required
                                    ></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a href="artigo.html" class="btn btn-outline-secondary">
                                        Cancelar
                                    </a>

                                    <button type="submit" class="btn btn-publicar">
                                        <i class="bi bi-check-lg me-1"></i>
                                        Salvar Alterações
                                    </button>
                                </div>

                                <div
                                    id="mensagemStatus"
                                    class="mt-3"
                                    role="status"
                                    aria-live="polite"
                                ></div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { auth } from "./firebase.js";

        import { onAuthStateChanged } from
            "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        import {
            getDatabase,
            ref,
            get,
            update,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const db = getDatabase();
        const form = document.getElementById("formArtigo");
        const mensagemStatus = document.getElementById("mensagemStatus");
        const botaoSalvar = form.querySelector('button[type="submit"]');

        // ID do artigo vem da URL: editar-artigo.html?id=XXXX
        const artigoId = new URLSearchParams(window.location.search).get("id");

        let usuarioAtual = null;

        function mostrarStatus(classe, texto) {
            mensagemStatus.className = "mt-3 " + classe;
            mensagemStatus.textContent = texto;
        }

        function bloquearFormulario(bloquear) {
            form.querySelectorAll("input, textarea, button[type='submit']")
                .forEach((el) => (el.disabled = bloquear));
        }

        async function carregarArtigo() {
            if (!artigoId) {
                bloquearFormulario(true);
                mostrarStatus("text-danger", "Artigo não informado. Volte e selecione um artigo para editar.");
                return;
            }

            bloquearFormulario(true);
            mostrarStatus("text-secondary", "Carregando artigo...");

            try {
                const snap = await get(ref(db, "artigosEducacionais/" + artigoId));

                if (!snap.exists()) {
                    mostrarStatus("text-danger", "Artigo não encontrado. Ele pode ter sido excluído.");
                    return;
                }

                const a = snap.val();

                document.getElementById("titulo").value = a.titulo ?? "";
                document.getElementById("autor").value = a.autor ?? "";
                document.getElementById("introducao").value = a.introducao ?? "";
                document.getElementById("mensagem").value = a.mensagem ?? "";
                document.getElementById("curiosidade").value = a.curiosidade ?? "";

                const radios = form.querySelectorAll('input[name="tema"]');
                radios.forEach((r) => {
                    r.checked = r.value === a.categoria;
                });

                bloquearFormulario(false);
                mensagemStatus.textContent = "";
                mensagemStatus.className = "mt-3";
            } catch (erro) {
                console.error("Erro ao carregar artigo:", erro);
                mostrarStatus("text-danger", "Não foi possível carregar o artigo. Verifique sua conexão e as permissões do Firebase.");
            }
        }

        onAuthStateChanged(auth, async (usuario) => {
            if (!usuario) {
                usuarioAtual = null;
                window.location.href = "login.html";
                return;
            }

            usuarioAtual = usuario;

            let nome = usuario.displayName || usuario.email || "Administrador";
            try {
                const adm = await get(ref(db, "administradores/" + usuario.uid));
                if (adm.exists() && adm.val().nome) nome = adm.val().nome;
            } catch (e) {
                // mantém o nome padrão
            }
            document.getElementById("user").textContent = nome;

            carregarArtigo();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!usuarioAtual) {
                mostrarStatus("text-danger", "Faça login para editar um artigo.");
                return;
            }

            if (!artigoId) {
                mostrarStatus("text-danger", "Artigo não informado.");
                return;
            }

            const titulo = document.getElementById("titulo").value.trim();
            const autor = document.getElementById("autor").value.trim();
            const introducao = document.getElementById("introducao").value.trim();
            const mensagem = document.getElementById("mensagem").value.trim();
            const curiosidade = document.getElementById("curiosidade").value.trim();
            const temaSelecionado = form.querySelector('input[name="tema"]:checked');

            if (!titulo || !autor || !introducao || !mensagem || !curiosidade || !temaSelecionado) {
                mostrarStatus("text-danger", "Preencha todos os campos antes de salvar.");
                return;
            }

            botaoSalvar.disabled = true;
            mostrarStatus("text-secondary", "Salvando alterações...");

            try {
                // update() altera só estes campos e preserva dataPublicacao, status e autorUid originais
                await update(ref(db, "artigosEducacionais/" + artigoId), {
                    titulo: titulo,
                    autor: autor,
                    categoria: temaSelecionado.value,
                    introducao: introducao,
                    mensagem: mensagem,
                    curiosidade: curiosidade,
                    editadoPorUid: usuarioAtual.uid,
                    dataEdicao: serverTimestamp()
                });

                mostrarStatus("text-success", "Artigo atualizado com sucesso! Redirecionando...");

                setTimeout(() => {
                    window.location.href = "artigo.html";
                }, 1200);
            } catch (erro) {
                console.error("Erro ao salvar artigo:", erro);
                mostrarStatus("text-danger", "Não foi possível salvar as alterações. Verifique sua conexão e as permissões do Firebase.");
                botaoSalvar.disabled = false;
            }
        });
    </script>
</body>
</html>
