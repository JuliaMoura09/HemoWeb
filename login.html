<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body style="background-color: #F9FAFB;">
    <div class="container">
        <header>
            <div class="logo" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 21px;">
                <img src="Logo.png" alt="Logo HemoConecta">
            </div>
        </header>

        <section class="login-card" style="width: 100%; height: 427px; min-height: 293px; background-color: white; border: 1px solid #e8eaee; border-radius: 6px; padding: 22px 102px 28px;">
            <div class="titulo" style="text-align: center; margin-bottom: 21px;">
                <h2>Bem-vindo de volta!</h2>
                <p>Acesse sua conta para gerenciar o aplicativo.</p>
            </div>

            <form action="POST">
                <div class="form-field" style="margin-bottom: 11px;">
                    <label for="exampleFormControlInput1" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="seu@email.com">
                </div>

                <div class="form-field" style="margin-bottom: 11px;">
                    <label for="exampleFormControlInput2" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="exampleFormControlInput2" placeholder="********">
                </div>

            <div class="esquecerSenha" style="text-align: right; margin-bottom: 11px;">
                <a href="#" style="color:#DA5552;;">Esqueci minha senha</a>
            </div>

            <div class="form-field" style="margin-bottom: 11px;">
                <input type="submit" class="form-control" style="background-color: #C62828; color: white;" id="exampleFormControlInput3" placeholder="Entrar">
            </div>
            </form>
        </section>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
