<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cupom HemoConecta</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pagina.css">
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <img src="logo2.png" alt="Logo HemoConecta" style="width: 20dvh; height: 5dvh;">
        </div>

        <div class="menu-label">Menu Principal</div>

        <nav class="nav flex-column">
            <a href="doadores.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Doadores</span>
            </a>

            <a href="notificacoes.html" class="nav-link">
                <i class="bi bi-bell"></i>
                <span>Notificações</span>
            </a>

            <a href="descontos.html" class="nav-link">
                <i class="bi bi-gift"></i>
                <span>Empresas Parceiras</span>
            </a>

            <a href="#" class="nav-link">
                <i class="bi bi-trophy"></i>
                <span>Medalhas e Rankings</span>
            </a>

            <a href="artigo.html" class="nav-link active">
                <i class="bi bi-book"></i>
                <span>Conteúdo Educacional</span>
            </a>
        </nav>
    </aside>

    <header class="topbar">
        <div class="text-end">
            <div class="user-name" id="user"></div>
            <div class="user-role">Administrador</div>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Novo Cupom</h1>

        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">

                    <div class="card artigo-card">
                        <div class="card-body p-3 p-md-4">

                            <form id="formCupom">

                                <div class="mb-3">
                                    <label for="titulo" class="form-label">
                                        Empresa Parceira
                                    </label>
                                    <br>

                                    <select id="empresaParceira" name="empresaParceira" class="form-control" required></select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label d-block">Tipo do Desconto</label>

                                    <div class="btn-group" role="group" aria-label="Tipo de desconto">
                                        <input type="radio" class="btn-check" name="tipoValor" id="tipoDinheiro" value="dinheiro" autocomplete="off" checked>
                                        <label class="btn btn-outline" for="tipoDinheiro">
                                             Dinheiro (R$)
                                        </label>

                                        <input type="radio" class="btn-check" name="tipoValor" id="tipoPorcentagem" value="porcentagem" autocomplete="off">
                                        <label class="btn btn-outline-black" for="tipoPorcentagem">
                                            Porcentagem (%)
                                        </label>
                                    </div>
                                </div>

                                <!--Campo Dinheiro-->
                                <div class="mb-3" id="campoDinheiro">
                                    <label for="valorDinheiro" class="form-label">Valor do Cupom</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" id="valorDinheiro" class="form-control"
                                            min="0.01" step="0.01" placeholder="Ex.: 20.00">
                                    </div>
                                </div>

                                <!-- Campo Porcentagem -->
                                <div class="mb-3 d-none" id="campoPorcentagem">
                                    <label for="valorPorcentagem" class="form-label">Valor do Desconto</label>
                                    <div class="input-group">
                                        <input type="number" id="valorPorcentagem" class="form-control"
                                            min="1" max="100" step="1" placeholder="Ex.: 10">
                                        <span class="input-group-text">%</span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="autor" class="form-label">
                                        Código do Cupom
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="codigoCupom"
                                        name="codigo"
                                        required
                                    >
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Pontos Necessários
                                    </label>

                                    <input
                                        type="number"
                                        id="pontosCupom"
                                        name="pontos"
                                        class="form-control"
                                        min="1"
                                        step="1"
                                        required>
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button type="submit" class="btn btn-publicar">
                                        <i class="bi bi-send-fill me-1"></i>
                                        Criar Cupom
                                    </button>
                                </div>

                                <div
                                    id="mensagemStatus"
                                    class="mt-3"
                                    role="status"
                                    aria-live="polite"
                                ></div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { auth } from "./firebase.js";
        import { onAuthStateChanged } from
            "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            getDatabase, ref, push, set, onValue, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const db = getDatabase();
        const form = document.getElementById("formCupom");
        const mensagemStatus = document.getElementById("mensagemStatus");
        const botaoPublicar = form.querySelector('button[type="submit"]');
        const selectEmpresas = document.getElementById("empresaParceira");

        let usuarioAtual = null;

        onAuthStateChanged(auth, (usuario) => {
            if (!usuario) {
                window.location.href = "login.html";
                return;
            }
            usuarioAtual = usuario;
            document.getElementById("user").textContent =
                usuario.displayName || usuario.nome || "Administrador";

            carregarEmpresas();
        });

        //Tipo de Desconto
        const campoDinheiro = document.getElementById("campoDinheiro");
        const campoPorcentagem = document.getElementById("campoPorcentagem");
        const valorDinheiro = document.getElementById("valorDinheiro");
        const valorPorcentagem = document.getElementById("valorPorcentagem");

        function atualizarCampoValor() {
            const tipo = document.querySelector('input[name="tipoValor"]:checked').value;
            const ehDinheiro = tipo === "dinheiro";

            campoDinheiro.classList.toggle("d-none", !ehDinheiro);
            campoPorcentagem.classList.toggle("d-none", ehDinheiro);

            // limpa o campo que foi escondido
            if (ehDinheiro) valorPorcentagem.value = "";
            else valorDinheiro.value = "";
        }

        document.querySelectorAll('input[name="tipoValor"]').forEach((r) => {
            r.addEventListener("change", atualizarCampoValor);
        });

        //Select de Empresas
        function carregarEmpresas() {
            onValue(ref(db, "parceiros"), (snapshot) => {
            const selecionado = selectEmpresas.value;
            selectEmpresas.innerHTML = '<option value="">Selecione...</option>';

            snapshot.forEach((child) => {
                const opt = document.createElement("option");
                opt.textContent = child.key;
                selectEmpresas.appendChild(opt);
            });

            selectEmpresas.value = selecionado;
        }, (erro) => console.error("Erro ao ler parceiros:", erro));
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!usuarioAtual) {
                mensagemStatus.className = "mt-3 text-danger";
                mensagemStatus.textContent = "Faça login para criar um cupom.";
                return;
            }

            const tipoValor = document.querySelector('input[name="tipoValor"]:checked').value;
            const valor = Number(tipoValor === "dinheiro" ? valorDinheiro.value : valorPorcentagem.value);

            const empresaId = selectEmpresas.value;
            const codigo = document.getElementById("codigoCupom").value.trim();
            const pontos = Number(document.getElementById("pontosCupom").value);

            if (!empresaId || !valor || !codigo || !pontos) {
                mensagemStatus.className = "mt-3 text-danger";
                mensagemStatus.textContent = "Preencha todos os campos antes de criar.";
                return;
            }

            if (tipoValor === "porcentagem" && (valor < 1 || valor > 100)) {
                mensagemStatus.className = "mt-3 text-danger";
                mensagemStatus.textContent = "A porcentagem deve estar entre 1 e 100.";
                return;
            }

            botaoPublicar.disabled = true;
            mensagemStatus.className = "mt-3 text-secondary";
            mensagemStatus.textContent = "Criando cupom...";

            try {
                const novoCupom = push(ref(db, `parceiros/${empresaId}/cupons`));

                await set(novoCupom, {
                    tipoValor: tipoValor,
                    valor: valor,
                    pontos: pontos,
                    ativo: true,
                    codCupom: codigo,
                    dataCriacao: serverTimestamp()
                });

                mensagemStatus.className = "mt-3 text-success";
                mensagemStatus.textContent = "Cupom criado com sucesso!";
                form.reset();
                atualizarCampoValor();
            } catch (erro) {
                console.error("Erro ao criar o cupom:", erro);
                mensagemStatus.className = "mt-3 text-danger";
                mensagemStatus.textContent =
                    "Não foi possível criar o cupom. Verifique sua conexão e as permissões do Firebase.";
            } finally {
                botaoPublicar.disabled = false;
            }
        });
    </script>
</body>
</html>
