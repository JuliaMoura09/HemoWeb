<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Educacional - HemoConecta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pagina.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="logo2.png" alt="Logo HemoConecta" style="width: 20dvh; height: 5dvh;">
        </div>

        <div class="menu-label">Menu Principal</div>

        <nav class="nav flex-column">
            <a href="doadores.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Doadores</span>
            </a>

            <a href="notificacoes.html" class="nav-link">
                <i class="bi bi-bell"></i>
                <span>Notificações</span>
            </a>

            <a href="descontos.html" class="nav-link">
                <i class="bi bi-gift"></i>
                <span>Empresas Parceiras</span>
            </a>

            <a href="#" class="nav-link">
                <i class="bi bi-trophy"></i>
                <span>Medalhas e Rankings</span>
            </a>

            <a href="artigo.html" class="nav-link active">
                <i class="bi bi-book"></i>
                <span>Conteúdo Educacional</span>
            </a>
        </nav>
    </aside>

    <header class="topbar">
        <div class="text-end">
            <div class="user-name" id="user"></div>
            <div class="user-role">Administrador</div>
        </div>
    </header>

    <main class="main-content">

        <div class="artigo-header">
            <div>
                <h1 class="page-title">Conteúdo Educacional</h1>
            </div>
            <button type="button" class="btn-add">Adicionar Artigo</button>
        </div>

        <div class="filtros" id="filtros">
            <button type="button" class="filtro-chip ativo" data-categoria="Todos">Todos</button>
            <button type="button" class="filtro-chip" data-categoria="Processo de Doação">Processo de Doação</button>
            <button type="button" class="filtro-chip" data-categoria="Tipos Sanguíneos">Tipos Sanguíneos</button>
            <button type="button" class="filtro-chip" data-categoria="Medula Óssea">Medula Óssea</button>
            <button type="button" class="filtro-chip" data-categoria="Mitos e Verdades">Mitos e Verdades</button>
            <button type="button" class="filtro-chip" data-categoria="Pós-doação">Pós-doação</button>
        </div>

        <div class="artigos-grid" id="listaArtigos"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const db = getDatabase();
    const lista = document.getElementById("listaArtigos");

    // Evita que texto do banco vire HTML
    function esc(texto) {
        const div = document.createElement("div");
        div.textContent = texto ?? "";
        return div.innerHTML;
    }

    // Administrador logado
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        const snap = await get(ref(db, "administradores/" + user.uid));
        if (snap.exists()) {
            document.getElementById("user").textContent = snap.val().nome;
        }

        carregarArtigos();
    });

    async function carregarArtigos() {
        const snap = await get(ref(db, "artigosEducacionais"));

        if (!snap.exists()) {
            lista.innerHTML = `<div class="sem-artigos">Nenhum artigo cadastrado.</div>`;
            return;
        }

        let html = "";

        snap.forEach((child) => {
            const a = child.val();
            const id = child.key;

            html += `
                <article class="artigo-card" data-categoria="${esc(a.categoria)}">
                    <div class="artigo-capa">
                        <span class="artigo-categoria">${esc(a.categoria)}</span>
                        <i class="bi bi-file-earmark-text"></i>
                    </div>
                    <div class="artigo-corpo">
                        <h3 class="artigo-titulo">${esc(a.titulo)}</h3>
                        <div class="artigo-rodape">
                            <div class="artigo-meta">
                                <span>${esc(a.autor)}</span>
                            </div>
                            <div class="artigo-acoes">
                                <button type="button" class="btn-acao editar" data-id="${esc(id)}" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button type="button" class="btn-acao excluir" data-id="${esc(id)}" title="Excluir">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        });

        lista.innerHTML = html;
    }

    // Filtros por categoria (esconde/mostra os cards já na tela)
    document.getElementById("filtros").addEventListener("click", (e) => {
        const chip = e.target.closest(".filtro-chip");
        if (!chip) return;

        document.querySelectorAll(".filtro-chip").forEach((c) => c.classList.remove("ativo"));
        chip.classList.add("ativo");

        const escolhida = chip.dataset.categoria;

        document.querySelectorAll(".artigo-card").forEach((card) => {
            const mostrar = escolhida === "Todos" || card.dataset.categoria === escolhida;
            card.style.display = mostrar ? "" : "none";
        });
    });

    // Editar / Excluir
    lista.addEventListener("click", (e) => {
        const botao = e.target.closest(".btn-acao");
        if (!botao) return;
        const id = botao.dataset.id;

        if (botao.classList.contains("excluir")) {
            // Ainda não apaga do banco (próximo passo)
            console.log("Excluir artigo:", id);
        } else {
            console.log("Editar artigo:", id);
        }
    });

    document.getElementById("btnNovoArtigo").addEventListener("click", () => {
        console.log("Novo artigo");
    });
</script>

</body>
</html>
