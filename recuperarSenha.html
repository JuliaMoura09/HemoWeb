<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F9FAFB;">
    <div class="container">
        <header>
            <div class="logo" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 21px;">
                <img src="Logo.png" alt="Logo HemoConecta">
            </div>
        </header>

        <section class="login-card" style="width: 100%; height: 427px; min-height: 293px; background-color: white; border: 1px solid #e8eaee; border-radius: 6px; padding: 22px 102px 28px;">
            <div class="titulo" style="text-align: center; margin-bottom: 21px;">
                <h2>Esqueceu sua senha?</h2>
                <p>Digite seu email para que seja enviado um link de recuperação.</p>
            </div>

            <form id="formRecuperar">
                <div class="form-field" style="margin-bottom: 11px;">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-field" style="margin-bottom: 11px;">
                    <input type="submit" class="form-control" style="background-color: #C62828; color: white;" id="btnEnviar" value="Enviar">
                </div>

                <div style="text-align: center;">
                    <a href="login.html" style="color:#DA5552;">Voltar ao login</a>
                </div>
            </form>

            <p id="mensagem" class="mt-3 text-center" role="status" aria-live="polite"></p>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { auth } from "./firebase.js";

        import {
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const formulario = document.getElementById("formRecuperar");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("btnEnviar");

        function mostrar(classe, texto) {
            mensagem.className = "mt-3 text-center " + classe;
            mensagem.textContent = texto;
        }

        formulario.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            if (!email) {
                mostrar("text-danger", "Digite seu e-mail.");
                return;
            }

            botao.disabled = true;
            mostrar("text-secondary", "Enviando...");

            // Depois de redefinir a senha, o Firebase oferece um link de volta ao login
            // (o domínio precisa estar em Authentication > Settings > Authorized domains)
            const configuracao = {
                url: new URL("login.html", window.location.href).href
            };

            try {
                try {
                    await sendPasswordResetEmail(auth, email, configuracao);
                } catch (erro) {
                    // Se o domínio ainda não foi autorizado, envia sem o link de retorno
                    if (erro.code === "auth/unauthorized-continue-uri" ||
                        erro.code === "auth/invalid-continue-uri") {
                        await sendPasswordResetEmail(auth, email);
                    } else {
                        throw erro;
                    }
                }

                mostrar("text-success",
                    "Link enviado. Redirecionando para o login...");

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 3000);

            } catch (erro) {
                console.log(erro.code, erro.message);

                if (erro.code === "auth/user-not-found") {
                    // Mesma resposta de sucesso para não revelar quais e-mails existem
                    mostrar("text-success",
                        "Link enviado. Redirecionando para o login...");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);
                    return;
                }

                if (erro.code === "auth/invalid-email") {
                    mostrar("text-danger", "E-mail inválido.");
                } else if (erro.code === "auth/too-many-requests") {
                    mostrar("text-danger", "Muitas tentativas. Aguarde alguns minutos e tente novamente.");
                } else {
                    mostrar("text-danger", "Não foi possível enviar o e-mail. Tente novamente.");
                }
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
