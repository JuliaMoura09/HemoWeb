<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Doadores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="pagina.css">
</head>
<body>
     <aside class="sidebar">
      
    <div class="brand">
      <img src="logo2.png" alt="Logo HemoConecta" style="width: 20dvh; height: 5dvh;">
    </div>

    <div class="menu-label">Menu Principal</div>
    <nav class="nav flex-column">
      <a href="#" class="nav-link active"><i class="bi bi-people"></i><span>Doadores</span></a>
      <a href="#" class="nav-link"><i class="bi bi-bell"></i><span>Notificações</span></a>
      <a href="#" class="nav-link"><i class="bi bi-gift"></i><span>Empresas Parceiras</span></a>
      <a href="#" class="nav-link"><i class="bi bi-trophy"></i><span>Medalhas e Rankings</span></a>
      <a href="#" class="nav-link"><i class="bi bi-book"></i><span>Conteúdo Educacional</span></a>
    </nav>
  </aside>

  <header class="topbar">
    <div class="text-end">
      <div class="user-name" id="user"></div>
      <div class="user-role">Administrador</div>
    </div>
  </header>

   <main class="main-content">
    <h1 class="page-title">Doadores</h1>

    <!-- Cartões de estatísticas -->
    <div class="stats-grid text-center">
    <div class="col-12 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Total de Usuários</div>
        <div class="stat-number" id="totalUsuarios">carregando...</div>
      </div>
    </div>
    <div class="col-12 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Aptos a Doar</div>
        <div class="stat-number number-green" id="totalAptos">carregando...</div>
      </div>
    </div>
    <div class="col-12 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Total de Doadores</div>
        <div class="stat-number number-orange" id="totalAguardando">carregando...</div>
      </div>
    </div>
    <div class="col-12 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Inaptos a Doar</div>
        <div class="stat-number number-red" id="totalInaptos">carregando...</div>
      </div>
    </div>
    </div>

    <!-- Pesquisa, filtros e tabela -->
    <section class="donor-panel">
      <div class="search-area">
        <div class="search-wrap">
          <i class="bi bi-search"></i>
          <input id="searchDonor" type="search" class="form-control search-input"
                 placeholder="Buscar por nome, CPF ou email..." aria-label="Buscar doador">
        </div>
        <button class="filter-button" type="button" data-bs-toggle="collapse" data-bs-target="#filters">
          <i class="bi bi-funnel me-1"></i> Mais Filtros
        </button>
      </div>

      <div class="collapse px-3 py-3 border-bottom" id="filters">
        <label for="bloodFilter" class="form-label small">Tipo sanguíneo</label>
        <select id="bloodFilter" class="form-select" style="max-width: 220px;">
          <option value="">Todos os tipos</option>
          <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
        </select>
      </div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th scope="col">Doador</th>
              <th scope="col">Tipo Sanguíneo</th>
              <th scope="col">Tipo Doador</th>
              <th scope="col" class="text-center">Email</th>
              <th scope="col" class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="donorTable">
</tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth } from "./firebase.js";

    import {signInWithEmailAndPassword,signOut, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import {onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const db = getDatabase();

    //Total de Usuários
    const usuariosRef = ref(db, "usuarios");

    onValue(usuariosRef, (snapshot) => {
    const total = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
    document.getElementById("totalUsuarios").textContent =
    total.toLocaleString("pt-BR");
    });

    //Aptos e Inaptos
    const fmt = (n) => n.toLocaleString("pt-BR");

    onValue(ref(db, "questionarios"),(snapshot) => {
        let aptos = 0;
        let inaptos = 0;

        snapshot.forEach((child) => {
          const questionario = child.val();

          if (questionario.apto === true) {
            aptos++;
          } else {
            inaptos++;
          }
        });

        document.getElementById("totalAptos").textContent = fmt(aptos);
        document.getElementById("totalInaptos").textContent = fmt(inaptos);
      },
      (erro) => {
        console.error("Erro ao ler o banco:", erro);
      }
    );

    //Informações do Doador
    const tbody = document.getElementById("donorTable");

    const esc = (v) =>
      String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));

    onValue(ref(db, "usuarios"), (snapshot) => {
      tbody.innerHTML = "";
      let totalDoadores = 0;

      snapshot.forEach((child) => {
        const u = child.val();

        if (u.isDoador !== true) return;
        totalDoadores++;

        const tr = document.createElement("tr");
              tr.innerHTML = `
                <td><span class="donor-name">${esc(u.nome)}</span></td>
                <td><span class="blood-type">${esc(u.tipoSanguineo)}</span></td>
                <td>${esc(u.tipoDoador)}</td>
                <td class="text-center">${esc(u.email)}</td>
                <td class="text-end">
                  <a href="#" class="action-icon" aria-label="Ver doador" title="Ver doador"><i class="bi bi-eye"></i></a>
                  <a href="mailto:${esc(u.email)}" class="action-icon" aria-label="Enviar e-mail" title="Enviar e-mail"><i class="bi bi-envelope"></i></a>
                  <a href="#" class="action-icon" aria-label="Mais opções" title="Mais opções"><i class="bi bi-three-dots-vertical"></i></a>
                </td>
              `;
        tbody.appendChild(tr);
      });

      document.getElementById("totalAguardando").textContent = fmt(totalDoadores);
    });

    //Informações Administrador
    onAuthStateChanged(auth, async (user) => {
      const snap = await get(ref(db, "administradores/" + user.uid));

      if (snap.exists()) {
        document.getElementById("user").textContent = snap.val().nome;
      }
    });

  </script>
</body>
</html>
