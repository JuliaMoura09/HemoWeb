<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Empresas Parceiras e Descontos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pagina.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="logo2.png" alt="Logo HemoConecta" style="width: 20dvh; height: 5dvh;">
        </div>

        <div class="menu-label">Menu Principal</div>

        <nav class="nav flex-column">
            <a href="doadores.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Doadores</span>
            </a>

            <a href="notificacoes.html" class="nav-link">
                <i class="bi bi-bell"></i>
                <span>Notificações</span>
            </a>

            <a href="descontos.html" class="nav-link active">
                <i class="bi bi-gift"></i>
                <span>Empresas Parceiras</span>
            </a>

            <a href="#" class="nav-link">
                <i class="bi bi-trophy"></i>
                <span>Medalhas e Rankings</span>
            </a>

            <a href="artigo.html" class="nav-link">
                <i class="bi bi-book"></i>
                <span>Conteúdo Educacional</span>
            </a>
        </nav>
    </aside>

    <header class="topbar">
    <div class="text-end">
      <div class="user-name" id="user"></div>
      <div class="user-role">Administrador</div>
    </div>
  </header>

    <!-- CONTEÚDO -->
    <main class="main-content">

        <div class="page-header">
            <div>
                <h1 class="page-title">Empresas Parceiras & Cupons</h1>
            </div>
            <div>
                <button type="button" class="btn-add" onclick="window.location.href='novoCupom.html'">Adicionar Cupom</button>
                <button type="button" class="btn-add">Adicionar Parceiro</button>
            </div>
        </div>

        <!-- Cartões de estatísticas -->
        <div class="stats-grid">
            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Empresas Parceiras</div>
                    <div class="stat-number number-blue" id="totalParceiras"></div>
                </div>
            </div>

            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Cupons Ativos</div>
                    <div class="stat-number number-green" id="totalCupons"></div>
                </div>
            </div>

            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Resgates (Mês)</div>
                    <div class="stat-number number-orange" id="totalResgates"></div>
                </div>
            </div>

            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Valor Médio Desconto</div>
                    <div class="stat-number number-dark" id="valorMedio"></div>
                </div>
            </div>
        </div>

        <!-- Abas -->
        <ul class="nav tabs-custom" id="abas" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-parceiras" type="button" role="tab">Empresas Parceiras</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cupons" type="button" role="tab">Cupons Ativos</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-parceiras" role="tabpanel">
                <div class="partners-grid" id="listaParceiras">

                    <div class="partner-card">
                        <div class="partner-head">
                            <div class="partner-avatar av-green">V</div>
                            <div class="partner-info">
                                <div class="partner-name">Vita</div>
                                <div class="partner-cat">Saúde</div>
                            </div>
                            <span class="badge-status badge-ativo">Ativo</span>
                        </div>
                        <div class="partner-stats">
                            <div><small>Cupons Ativos</small><strong>12</strong></div>
                            <div><small>Total Resgates</small><strong>450</strong></div>
                        </div>
                    </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { auth } from "./firebase.js";

        import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const db = getDatabase();

        //Informações Administrador
        onAuthStateChanged(auth, async (user) => {
          const snap = await get(ref(db, "administradores/" + user.uid));

          if (snap.exists()) {
            document.getElementById("user").textContent = snap.val().nome;
          }
        });

        //Empresas Parceiras
        const parceirosRef = ref(db, "parceiros");

      onValue(parceirosRef, (snapshot) => {
      const total = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
      document.getElementById("totalParceiras").textContent =
      total.toLocaleString("pt-BR");
      });
    </script>
</body>
</html>
