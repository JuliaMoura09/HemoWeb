<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Empresas Parceiras e Descontos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pagina.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="logo2.png" alt="Logo HemoConecta" style="width: 20dvh; height: 5dvh;">
        </div>

        <div class="menu-label">Menu Principal</div>

        <nav class="nav flex-column">
            <a href="doadores.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Doadores</span>
            </a>

            <a href="descontos.html" class="nav-link active">
                <i class="bi bi-gift"></i>
                <span>Empresas Parceiras</span>
            </a>

            <a href="#" class="nav-link">
                <i class="bi bi-trophy"></i>
                <span>Medalhas e Rankings</span>
            </a>

            <a href="artigo.html" class="nav-link">
                <i class="bi bi-book"></i>
                <span>Conteúdo Educacional</span>
            </a>
        </nav>
    </aside>

    <header class="topbar">
        <div class="text-end">
            <div class="user-name" id="user"></div>
            <div class="user-role">Administrador</div>
        </div>
    </header>

    <main class="main-content">

        <div class="page-header">
            <div>
                <h1 class="page-title">Empresas Parceiras & Cupons</h1>
            </div>
            <div>
                <button type="button" class="btn-add" onclick="window.location.href='novoCupom.html'">Adicionar Cupom</button>
            </div>
        </div>

        <!-- Cartões de estatísticas -->
        <div class="stats-grid">
            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Empresas Parceiras</div>
                    <div class="stat-number number-blue" id="totalParceiras">0</div>
                </div>
            </div>

            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Cupons Ativos</div>
                    <div class="stat-number number-green" id="totalCupons">0</div>
                </div>
            </div>

            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Resgates (Mês)</div>
                    <div class="stat-number number-orange" id="totalResgates">0</div>
                </div>
            </div>

            <div class="stat-card stat-flex">
                <div>
                    <div class="stat-label">Valor Médio Desconto</div>
                    <div class="stat-number number-dark" id="valorMedio">—</div>
                </div>
            </div>
        </div>

        <!-- Abas -->
        <ul class="nav tabs-custom" id="abas" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-parceiras" type="button" role="tab">Empresas Parceiras</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cupons" type="button" role="tab">Cupons Ativos</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-parceiras" role="tabpanel">
                <div class="partners-grid" id="listaParceiras"></div>
            </div>

            <div class="tab-pane fade" id="tab-cupons" role="tabpanel">
                <div class="partners-grid" id="listaCupons"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { auth } from "./firebase.js";

        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const db = getDatabase();

        // Informações Administrador
        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            const snap = await get(ref(db, "administradores/" + user.uid));
            if (snap.exists()) {
                document.getElementById("user").textContent = snap.val().nome;
            }
        });

        // Helpers
        const fmtNum = (n) => Number(n).toLocaleString("pt-BR");
        const fmtMoeda = (n) =>
            Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function statBox(label, valor) {
            const div = document.createElement("div");
            div.append(el("small", null, label), el("strong", null, valor));
            return div;
        }

        function descontoTexto(c) {
            return c.tipoValor === "porcentagem" ? `${c.valor}%` : fmtMoeda(c.valor);
        }

        function cardParceiro(nome, categoria, ativos, resgates) {
            const card = el("div", "partner-card");

            const head = el("div", "partner-head");
            head.append(el("div", "partner-avatar av-green", nome.charAt(0).toUpperCase()));

            const info = el("div", "partner-info");
            info.append(el("div", "partner-name", nome), el("div", "partner-cat", categoria));
            head.append(info);

            const ativo = ativos > 0;
            head.append(el("span", "badge-status " + (ativo ? "badge-ativo" : ""), ativo ? "Ativo" : "Inativo"));

            const stats = el("div", "partner-stats");
            stats.append(statBox("Cupons Ativos", fmtNum(ativos)), statBox("Total Resgates", fmtNum(resgates)));

            card.append(head, stats);
            return card;
        }

        function cardCupom(empresa, c) {
            const card = el("div", "partner-card");

            const head = el("div", "partner-head");
            head.append(el("div", "partner-avatar av-green", empresa.charAt(0).toUpperCase()));

            const info = el("div", "partner-info");
            info.append(el("div", "partner-name", c.codCupom || "—"), el("div", "partner-cat", empresa));
            head.append(info, el("span", "badge-status badge-ativo", "Ativo"));

            const stats = el("div", "partner-stats");
            stats.append(statBox("Desconto", descontoTexto(c)), statBox("Pontos", fmtNum(c.pontos || 0)));

            card.append(head, stats);
            return card;
        }

        // Empresas Parceiras + Cupons (tempo real)
        onValue(ref(db, "parceiros"), (snapshot) => {
            const listaParceiras = document.getElementById("listaParceiras");
            const listaCupons = document.getElementById("listaCupons");
            listaParceiras.innerHTML = "";
            listaCupons.innerHTML = "";

            let totalParceiras = 0;
            let totalAtivos = 0;
            let totalResgates = 0;
            const somaDinheiro = [];
            const somaPorcent = [];

            snapshot.forEach((child) => {
                const nome = child.key;
                const dados = child.val() || {};
                const cupons = Object.values(dados.cupons || {});
                const ativos = cupons.filter((c) => c.ativo);
                const resgates = cupons.reduce((s, c) => s + (Number(c.resgates) || 0), 0);
                const categoria = dados.categoria || (cupons[0] && cupons[0].categoria) || "—";

                totalParceiras++;
                totalAtivos += ativos.length;
                totalResgates += resgates;

                listaParceiras.append(cardParceiro(nome, categoria, ativos.length, resgates));

                ativos.forEach((c) => {
                    listaCupons.append(cardCupom(nome, c));
                    (c.tipoValor === "porcentagem" ? somaPorcent : somaDinheiro).push(Number(c.valor) || 0);
                });
            });

            const media = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
            const partes = [];
            if (somaDinheiro.length) partes.push(fmtMoeda(media(somaDinheiro)));
            if (somaPorcent.length) partes.push(Math.round(media(somaPorcent)) + "%");

            document.getElementById("totalParceiras").textContent = fmtNum(totalParceiras);
            document.getElementById("totalCupons").textContent = fmtNum(totalAtivos);
            document.getElementById("totalResgates").textContent = fmtNum(totalResgates);
            document.getElementById("valorMedio").textContent = partes.length ? partes.join(" · ") : "—";
        }, (erro) => console.error("Erro ao ler parceiros:", erro));
    </script>
</body>
</html>
