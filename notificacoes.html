      </div>
    </div>
    <div class="col-12 col-md-3">

        <div class="stat-label">Taxa de Abertura</div>
        <div class="stat-number number-green" id="totalAptos">carregando...</div>

    <div class="col-12 col-md-3">

        <div class="stat-label">Link de Agendamento</div>
        <div class="stat-number number-orange" id="totalAguardando">carregando...</div>
      </div>
    </div>
    <div class="col-12 col-md-3">
